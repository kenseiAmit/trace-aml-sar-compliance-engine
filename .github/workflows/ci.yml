name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: AML & FinCEN SAR Unit Suite (31 Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install runtime & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.0.0" "pydantic>=2.0.0" "openai>=1.0.0" "python-dotenv>=1.0.0" "pytest>=8.0.0"
      - name: Execute deterministic pytest suite
        env:
          PYTHONPATH: .:src
          OPENAI_API_KEY: sk-test-api-key-for-unit-tests-only
        run: pytest tests/ -v
